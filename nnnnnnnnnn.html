<!DOCTYPE html>
<html>
<head>
    <title>5x5 Table with Loop</title>
</head>
<body>
    <h2>5 x 5 Table </h2>
    <table border="0" cellpadding="10" cellspacing="0" id="myTable"></table>

    <script>
        let table = document.getElementById("myTable");

        // Loop for 5 rows
        for (let i = 0; i < 5; i++) {
            let row = document.createElement("tr");

            // Loop for 5 columns (numbers 1 to 5)
            for (let j = 1; j <= 5; j++) {
                let cell = document.createElement("td");
                cell.textContent = j;
                row.appendChild(cell);
            }

            table.appendChild(row);
        }
    </script>
</body>
</html>
