<!DOCTYPE html>
<html>
<head>
  <title>Smart Attendance Dashboard</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .module { border: 1px solid #ccc; padding: 20px; margin: 10px; }
    h2 { margin-top: 0; }
    input, button { display: block; margin: 5px 0; padding: 8px; }
  </style>
</head>
<body>
  <h1>Smart Attendance Dashboard</h1>

  <div class="module" id="login">
    <h2>Login</h2>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button>Login</button>
  </div>

  <div class="module" id="student-records">
    <h2>Student Records</h2>
    <input type="text" placeholder="Student ID">
    <input type="text" placeholder="Name">
    <button>Add Record</button>
  </div>

  <div class="module" id="attendance-marking">
    <h2>Attendance Marking</h2>
    <input type="text" placeholder="Student ID">
    <select>
      <option>Present</option>
      <option>Absent</option>
      <option>Late</option>
    </select>
    <button>Mark Attendance</button>
  </div>

  <div class="module" id="reports">
    <h2>Reports</h2>
    <button>Generate Report</button>
    <div id="report-output"></div>
  </div>

  <div class="module" id="admin-dashboard">
    <h2>Admin Dashboard</h2>
    <button>View All Records</button>
    <button>Analytics</button>
  </div>
</body>
</html>
